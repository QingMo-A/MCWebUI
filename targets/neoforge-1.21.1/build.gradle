plugins {
    id 'net.neoforged.moddev' version '2.0.141'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

def framePacingProof = providers.gradleProperty('mcwebuiFramePacingProof').map { it.toBoolean() }.orElse(false)
def directCef = providers.gradleProperty('mcwebuiBrowserBackend').map { it.equalsIgnoreCase('direct-cef') }.orElse(false)
def directCefProof = providers.gradleProperty('mcwebuiDirectCefProof').map { it.toBoolean() }.orElse(false)
def directCefBridgeIntegration = providers.gradleProperty('mcwebuiDirectCefBridgeIntegration').map { it.toBoolean() }.orElse(false)
def proofPackage = providers.gradleProperty('mcwebuiProofPackage').orElse('').get()
def proofInstanceRoot = providers.gradleProperty('mcwebuiProofInstanceRoot').orElse('').get()
def proofEvidence = providers.gradleProperty('mcwebuiProofEvidence').orElse('').get()
def proofDescriptor = providers.gradleProperty('mcwebuiProofDescriptor').orElse('').get()
def proofMode = providers.gradleProperty('mcwebuiProofMode').orElse('').get()
def directCefReleaseDescriptor = providers.gradleProperty('mcwebuiDirectCefReleaseDescriptor')
def directCefReleaseStage = layout.buildDirectory.dir('generated/direct-cef-release')

sourceSets {
    main {
        java.srcDir(rootProject.file('common/src/main/java'))
        resources.srcDir(rootProject.file('common/src/main/resources'))
        if (framePacingProof.get()) {
            java.srcDir('src/framePacingProof/java')
        } else {
            java.srcDir('src/stock/java')
        }
    }
}

dependencies {
    implementation 'net.neoforged:neoforge:21.1.216'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
}

if (framePacingProof.get()) {
    def patchedMcefJar = providers.environmentVariable('MCWEBUI_PATCHED_MCEF_JAR').orNull
    def patchedNativeDir = providers.environmentVariable('MCWEBUI_PATCHED_NATIVE_DIR').orNull
    def patchedNativeName = providers.environmentVariable('MCWEBUI_PATCHED_NATIVE_NAME').orElse('jcef.dll').get()
    def patchedMcefSha = providers.environmentVariable('MCWEBUI_PATCHED_MCEF_SHA256').orNull
    def patchedNativeSha = providers.environmentVariable('MCWEBUI_PATCHED_JCEF_SHA256').orNull
    if (patchedMcefJar == null || !file(patchedMcefJar).isFile()) {
        throw new GradleException('mcwebuiFramePacingProof=true requires MCWEBUI_PATCHED_MCEF_JAR to point to a matched patched MCEF jar (JCEF+MCEF patches under native/patches).')
    }
    def patchedNativePlatformDir = patchedNativeDir == null ? null : file(new File(patchedNativeDir, 'windows_amd64'))
    def patchedNativeFile = patchedNativePlatformDir == null ? null : file(new File(patchedNativePlatformDir, patchedNativeName))
    def patchedCefFile = patchedNativePlatformDir == null ? null : file(new File(patchedNativePlatformDir, 'libcef.dll'))
    if (patchedNativeDir == null ||
            !patchedNativeFile.isFile() ||
            !patchedCefFile.isFile()) {
        throw new GradleException("mcwebuiFramePacingProof=true requires MCWEBUI_PATCHED_NATIVE_DIR/windows_amd64 to contain $patchedNativeName and its matching CEF runtime siblings.")
    }
    if (patchedMcefSha == null || patchedNativeSha == null) {
        throw new GradleException('Proof mode requires MCWEBUI_PATCHED_MCEF_SHA256 and MCWEBUI_PATCHED_JCEF_SHA256 so Java/native revisions cannot be mixed.')
    }
    def sha256 = { File input -> java.security.MessageDigest.getInstance('SHA-256').digest(input.bytes).encodeHex().toString().toUpperCase(Locale.ROOT) }
    def actualMcefSha = sha256(file(patchedMcefJar))
    def actualNativeSha = sha256(patchedNativeFile)
    if (!actualMcefSha.equalsIgnoreCase(patchedMcefSha) || !actualNativeSha.equalsIgnoreCase(patchedNativeSha)) {
        throw new GradleException("Proof artifact SHA-256 mismatch (MCEF=$actualMcefSha, JCEF=$actualNativeSha). Refusing to mix unmatched Java/native artifacts.")
    }
    dependencies {
        compileOnly files(patchedMcefJar)
        runtimeOnly files(patchedMcefJar)
        testCompileOnly files(patchedMcefJar)
    }
    tasks.withType(JavaExec).configureEach {
        jvmArgs "-Dmcwebui.framePacingProof=true", "-Dmcwebui.mcef.proof.nativeDir=${patchedNativePlatformDir.absolutePath}"
    }
} else {
    dependencies {
        compileOnly 'com.cinemamod:mcef:2.1.6-1.21.1'
        testCompileOnly 'com.cinemamod:mcef:2.1.6-1.21.1'
        // Direct CEF loads the pinned CEF144 DLL in-process.  Keeping the MCEF
        // NeoForge runtime mod on that classpath would load a second libcef
        // (the stock JCEF build) before F8 and makes the two runtimes unsafe to
        // coexist.  The default property remains MCEF and keeps the original
        // runtime dependency unchanged.
        if (!directCefProof.get()) {
            runtimeOnly 'com.cinemamod:mcef-neoforge:2.1.6-1.21.1'
        }
    }
}

if (directCef.get()) {
    tasks.withType(JavaExec).configureEach {
        def directUrl = providers.gradleProperty('mcwebuiDirectCefUrl').orElse('').get()
        def directRuntime = providers.gradleProperty('mcwebuiDirectCefRuntimeDir').orElse('').get()
        def directInstanceRoot = providers.gradleProperty('mcwebuiDirectCefInstanceRoot').orElse('').get()
        def directCache = providers.gradleProperty('mcwebuiDirectCefCacheDir').orElse('').get()
        def directTargetHz = providers.gradleProperty('mcwebuiDirectCefTargetHz').orElse('60').get()
        def directPackage = providers.gradleProperty('mcwebuiDirectCefPackage').orElse('').get()
        jvmArgs "-Dmcwebui.browserBackend=direct-cef",
                "-Dmcwebui.directCef.targetHz=${directTargetHz}"
        if (!directInstanceRoot.isBlank()) {
            jvmArgs "-Dmcwebui.directCef.instanceRoot=${directInstanceRoot}"
        }
        if (!directRuntime.isBlank()) {
            jvmArgs "-Dmcwebui.directCef.runtimeDir=${directRuntime}"
        }
        if (!directCache.isBlank()) {
            jvmArgs "-Dmcwebui.directCef.cacheDir=${directCache}"
        }
        if (!directUrl.isBlank()) {
            // Explicit loopback URLs remain available for isolated transport tests.
            // Normal Direct runs omit this property and serve the bundled page from
            // inside the Minecraft process, independent of the launcher shell.
            jvmArgs "-Dmcwebui.directCef.url=${directUrl}"
        }
        if (!directPackage.isBlank()) {
            // Prefill the runtime setup screen's package path box for acceptance runs.
            jvmArgs "-Dmcwebui.directCef.package=${directPackage}"
        }
    }
}

neoForge {
    version = '21.1.216'
    runs {
        client {
            client()
            gameDirectory = rootProject.file('run')
        }
    }
    mods {
        mcwebui {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    if (!proofPackage.isBlank()) {
        systemProperty 'mcwebui.proof.package', proofPackage
    }
    if (!proofInstanceRoot.isBlank()) {
        systemProperty 'mcwebui.proof.instanceRoot', proofInstanceRoot
    }
    if (!proofEvidence.isBlank()) {
        systemProperty 'mcwebui.proof.evidence', proofEvidence
    }
    if (!proofDescriptor.isBlank()) {
        systemProperty 'mcwebui.proof.descriptor', proofDescriptor
    }
    if (!proofMode.isBlank()) {
        systemProperty 'mcwebui.proof.mode', proofMode
    }
    if (directCefBridgeIntegration.get()) {
        systemProperty 'mcwebui.directCef.integration', 'true'
        systemProperty 'mcwebui.directCef.integration.url',
                providers.gradleProperty('mcwebuiDirectCefUrl').orElse('').get()
        systemProperty 'mcwebui.directCef.integration.cacheDir',
                providers.gradleProperty('mcwebuiDirectCefCacheDir').orElse('').get()
        systemProperty 'mcwebui.directCef.integration.runtimeDir',
                providers.gradleProperty('mcwebuiDirectCefRuntimeDir').orElse('').get()
        systemProperty 'mcwebui.directCef.integration.instanceRoot',
                providers.gradleProperty('mcwebuiDirectCefInstanceRoot').orElse('').get()
        systemProperty 'mcwebui.directCef.integration.resources',
                layout.buildDirectory.dir('resources/main').get().asFile.absolutePath
    }
}

def prepareDirectCefReleaseDescriptor = tasks.register('prepareDirectCefReleaseDescriptor') {
    group = 'mcwebui'
    description = 'Validate and stage the optional project-owned Direct CEF release descriptor.'
    dependsOn(tasks.named('compileJava'))
    inputs.property('mcwebuiDirectCefReleaseDescriptor', directCefReleaseDescriptor.orElse('').get())
    outputs.dir(directCefReleaseStage)
    doLast {
        File stage = directCefReleaseStage.get().asFile
        project.delete(stage)
        String configuredValue = directCefReleaseDescriptor.orElse('').get().trim()
        if (configuredValue.isEmpty()) return

        File input = new File(configuredValue)
        if (!input.isAbsolute()) {
            throw new GradleException('mcwebuiDirectCefReleaseDescriptor must be an absolute path: ' + configuredValue)
        }
        if (!input.isFile()) {
            throw new GradleException('mcwebuiDirectCefReleaseDescriptor does not point to a file: ' + input)
        }

        javaexec {
            classpath = files(sourceSets.main.output.classesDirs)
            mainClass = 'dev.qingmo.mcwebui.nativecef.DirectCefRuntimeReleaseDescriptorBuildValidator'
            args input.absolutePath
        }
        project.copy {
            from(input)
            into(new File(stage, 'META-INF/mcwebui'))
            rename { 'direct-cef-runtime-release.json' }
        }
    }
}

tasks.named('processResources') {
    dependsOn(prepareDirectCefReleaseDescriptor)
    dependsOn(rootProject.tasks.named('frontendBuild'))
    from(rootProject.file('frontend/playground/dist')) {
        into('web/playground')
    }
    from(directCefReleaseStage)
}

tasks.named('jar') {
    dependsOn(project(':common').tasks.named('jar'))
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({ zipTree(project(':common').tasks.named('jar').get().archiveFile.get().asFile) })
}
