plugins {
    id 'java'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation project(':common')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('jar') {
    dependsOn(project(':common').tasks.named('jar'))
    dependsOn(rootProject.tasks.named('frontendBuild'))
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({ zipTree(project(':common').tasks.named('jar').get().archiveFile.get().asFile) })
    from(rootProject.file('frontend/playground/dist')) {
        into('web/playground')
    }
}

