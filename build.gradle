plugins {
    id 'base'
    id 'com.github.node-gradle.node' version '7.1.0'
}

node {
    version = '22.22.2'
    npmVersion = '10.9.7'
    download = true
    nodeProjectDir = rootProject.projectDir
}

allprojects {
    group = 'dev.qingmo.mcwebui'
    version = '0.1.0-SNAPSHOT'

    repositories {
        mavenCentral()
        maven { url = uri('https://maven.neoforged.net/releases') }
        maven { url = uri('https://mcef-download.cinemamod.com/repositories/releases') }
    }
}

if (!gradle.ext.has('mcwebuiTargetManifest')) {
    throw new GradleException('Validated MCWebUI target manifest is unavailable')
}

def targetManifest = gradle.ext.mcwebuiTargetManifest
def targetEntries = targetManifest.targets

def frontendDirectory = rootProject.projectDir
def frontendLock = file('package-lock.json')

tasks.register('frontendInstall', com.github.gradle.node.npm.task.NpmTask) {
    group = 'mcwebui'
    description = 'Install the locked frontend workspace dependencies.'
    workingDir.set(frontendDirectory)
    args = ['ci']
    inputs.file(frontendLock)
    outputs.dir(new File(frontendDirectory, 'node_modules'))
}

tasks.register('frontendTypecheck', com.github.gradle.node.npm.task.NpmTask) {
    group = 'mcwebui'
    description = 'Typecheck all MCWebUI frontend workspaces.'
    dependsOn('frontendInstall')
    workingDir.set(frontendDirectory)
    args = ['run', 'typecheck:web']
}

tasks.register('frontendBuild', com.github.gradle.node.npm.task.NpmTask) {
    group = 'mcwebui'
    description = 'Build the shared Vue frontend bundle.'
    dependsOn('frontendInstall')
    workingDir.set(frontendDirectory)
    args = ['run', 'build:web']
    inputs.dir(file('frontend'))
    outputs.dir(file('frontend/playground/dist'))
}

def registerLifecycleAlias = { String name, String targetPath, String targetTask, String description ->
    tasks.register(name) {
        group = 'mcwebui'
        this.description = description
        dependsOn("${targetPath}:${targetTask}")
    }
}

targetEntries.each { target ->
    registerLifecycleAlias("compile${target.taskSuffix}", target.projectPath, 'compileJava', "Compile ${target.displayName}")
    registerLifecycleAlias("test${target.taskSuffix}", target.projectPath, 'test', "Test ${target.displayName}")
    registerLifecycleAlias("build${target.taskSuffix}", target.projectPath, 'build', "Build ${target.displayName}")
}

tasks.register('compileAllTargets') {
    group = 'mcwebui'
    description = 'Compile every registered Minecraft target.'
    dependsOn(targetEntries.collect { "${it.projectPath}:compileJava" })
}

tasks.register('testAllTargets') {
    group = 'mcwebui'
    description = 'Test every registered Minecraft target.'
    dependsOn(targetEntries.collect { "${it.projectPath}:test" })
}

tasks.register('buildAllTargets') {
    group = 'mcwebui'
    description = 'Build every registered Minecraft target.'
    dependsOn(targetEntries.collect { "${it.projectPath}:build" })
}

tasks.register('runClient') {
    group = 'mcwebui'
    description = "Run the default target (${targetManifest.defaultTarget}) client when its adapter exposes a run task."
    def defaultEntry = targetEntries.find { it.id == targetManifest.defaultTarget }
    if (defaultEntry != null) {
        def candidate = "${defaultEntry.projectPath}:runClient"
        dependsOn(candidate)
    }
}

tasks.register('architectureCheck') {
    group = 'verification'
    description = 'Check common contracts remain independent from loader and browser implementation APIs.'
    doLast {
        def forbidden = ~/import\s+(net\.minecraft|net\.minecraftforge|net\.neoforged|org\.cef|org\.cef\.browser|net\.montoyo\.mcef|com\.github\.CCBlueX\.mcef)/
        fileTree('common/src/main/java').matching { include '**/*.java' }.files.each { source ->
            if (forbidden.matcher(source.getText('UTF-8')).find()) {
                throw new GradleException("Forbidden target/browser import in common: ${source}")
            }
        }
        ['frontend/forge', 'frontend/neoforge', 'frontend/forge-playground', 'frontend/neoforge-playground'].each { duplicate ->
            if (file(duplicate).exists()) throw new GradleException("Target-specific frontend bundle found: ${duplicate}")
        }
    }
}

tasks.named('check') { dependsOn('architectureCheck') }

tasks.named('build') {
    dependsOn('buildAllTargets')
}
