plugins {
    id 'base'
    id 'com.github.node-gradle.node' version '7.1.0'
}

node {
    version = '22.22.2'
    npmVersion = '10.9.7'
    download = true
    nodeProjectDir = rootProject.projectDir
}

def resolvedMcwebuiVersion = providers.gradleProperty('mcwebuiVersion')
        .orElse('0.1.0-SNAPSHOT')
        .get()

allprojects {
    group = 'dev.qingmo.mcwebui'
    version = resolvedMcwebuiVersion

    repositories {
        mavenCentral()
        maven { url = uri('https://maven.neoforged.net/releases') }
        maven { url = uri('https://mcef-download.cinemamod.com/repositories/releases') }
    }
}

if (!gradle.ext.has('mcwebuiTargetManifest')) {
    throw new GradleException('Validated MCWebUI target manifest is unavailable')
}

def targetManifest = gradle.ext.mcwebuiTargetManifest
def targetEntries = targetManifest.targets

def frontendDirectory = rootProject.projectDir
def frontendLock = file('package-lock.json')

tasks.register('frontendInstall', com.github.gradle.node.npm.task.NpmTask) {
    group = 'mcwebui'
    description = 'Install the locked frontend workspace dependencies.'
    workingDir.set(frontendDirectory)
    args = ['ci']
    inputs.file(frontendLock)
    outputs.dir(new File(frontendDirectory, 'node_modules'))
}

tasks.register('frontendTypecheck', com.github.gradle.node.npm.task.NpmTask) {
    group = 'mcwebui'
    description = 'Typecheck all MCWebUI frontend workspaces.'
    dependsOn('frontendInstall')
    workingDir.set(frontendDirectory)
    args = ['run', 'typecheck:web']
}

tasks.register('frontendBuild', com.github.gradle.node.npm.task.NpmTask) {
    group = 'mcwebui'
    description = 'Build the shared Vue frontend bundle.'
    dependsOn('frontendInstall')
    workingDir.set(frontendDirectory)
    args = ['run', 'build:web']
    inputs.dir(file('frontend'))
    outputs.dir(file('frontend/playground/dist'))
}

def registerLifecycleAlias = { String name, String targetPath, String targetTask, String description ->
    tasks.register(name) {
        group = 'mcwebui'
        this.description = description
        dependsOn("${targetPath}:${targetTask}")
    }
}

targetEntries.each { target ->
    registerLifecycleAlias("compile${target.taskSuffix}", target.projectPath, 'compileJava', "Compile ${target.displayName}")
    registerLifecycleAlias("test${target.taskSuffix}", target.projectPath, 'test', "Test ${target.displayName}")
    registerLifecycleAlias("build${target.taskSuffix}", target.projectPath, 'build', "Build ${target.displayName}")
}

tasks.register('compileAllTargets') {
    group = 'mcwebui'
    description = 'Compile every registered Minecraft target.'
    dependsOn(targetEntries.collect { "${it.projectPath}:compileJava" })
}

tasks.register('testAllTargets') {
    group = 'mcwebui'
    description = 'Test every registered Minecraft target.'
    dependsOn(targetEntries.collect { "${it.projectPath}:test" })
}

tasks.register('buildAllTargets') {
    group = 'mcwebui'
    description = 'Build every registered Minecraft target.'
    dependsOn(targetEntries.collect { "${it.projectPath}:build" })
}

tasks.register('runClient') {
    group = 'mcwebui'
    description = "Run the default target (${targetManifest.defaultTarget}) client when its adapter exposes a run task."
    def defaultEntry = targetEntries.find { it.id == targetManifest.defaultTarget }
    if (defaultEntry != null) {
        def candidate = "${defaultEntry.projectPath}:runClient"
        dependsOn(candidate)
    }
}

tasks.register('architectureCheck') {
    group = 'verification'
    description = 'Check common contracts remain independent from loader and browser implementation APIs.'
    doLast {
        def forbidden = ~/import\s+(net\.minecraft|net\.minecraftforge|net\.neoforged|org\.cef|org\.cef\.browser|net\.montoyo\.mcef|com\.github\.CCBlueX\.mcef)/
        fileTree('common/src/main/java').matching { include '**/*.java' }.files.each { source ->
            if (forbidden.matcher(source.getText('UTF-8')).find()) {
                throw new GradleException("Forbidden target/browser import in common: ${source}")
            }
        }
        ['frontend/forge', 'frontend/neoforge', 'frontend/forge-playground', 'frontend/neoforge-playground'].each { duplicate ->
            if (file(duplicate).exists()) throw new GradleException("Target-specific frontend bundle found: ${duplicate}")
        }

        // A consumer must prove that the published Developer Preview surface is
        // sufficient.  It may depend on the public API/resource packages and
        // loader APIs, but never on target/backend implementation classes.
        File consumerRoot = file('samples/neoforge-1.21.1-consumer')
        if (consumerRoot.isDirectory()) {
            def forbiddenConsumerImports = ~/(?m)^\s*import\s+(dev\.qingmo\.mcwebui\.(?:target|nativecef)(?:\.|;)|org\.cef(?:\.|;)|com\.cinemamod\.mcef(?:\.|;))/
            fileTree(consumerRoot).matching { include '**/src/**/*.java' }.files.each { source ->
                String text = source.getText('UTF-8')
                if (forbiddenConsumerImports.matcher(text).find()) {
                    throw new GradleException("Forbidden MCWebUI implementation import in consumer sample: ${source}")
                }
            }
            File sampleBuild = new File(consumerRoot, 'build.gradle')
            if (sampleBuild.isFile()) {
                String buildText = sampleBuild.getText('UTF-8')
                if (buildText =~ /project\s*\(\s*['\"]?:targets:|common[\\\/]src[\\\/]main|sourceSets\.main\.output/) {
                    throw new GradleException('Consumer sample must resolve MCWebUI through the staged binary artifact, not project/sourceSet/classes outputs')
                }
            }
        }

        // Keep the optional MCEF/JCEF surface behind the three deliberate
        // adapter boundaries.  In particular, public API, backend selection,
        // Direct CEF, and screen/session orchestration must not accidentally
        // class-load MCEF implementation types when MCEF is absent.
        File neoforgeMain = file('targets/neoforge-1.21.1/src/main/java')
        if (neoforgeMain.isDirectory()) {
            Set<String> mcefBoundaryFiles = [
                    'dev/qingmo/mcwebui/target/neoforge1211/NeoForgeMcefBootstrap.java',
                    'dev/qingmo/mcwebui/target/neoforge1211/NeoForgeMcefBackend.java',
                    'dev/qingmo/mcwebui/target/neoforge1211/McuiSchemeHandler.java'
            ] as Set<String>
            def mcefImport = ~/(?m)^\s*import\s+(?:org\.cef|com\.cinemamod\.mcef)(?:\.|;)/
            fileTree(neoforgeMain).matching { include '**/*.java' }.files.each { source ->
                String relative = neoforgeMain.toPath().relativize(source.toPath()).toString().replace('\\', '/')
                if (mcefImport.matcher(source.getText('UTF-8')).find()
                        && !mcefBoundaryFiles.contains(relative)) {
                    throw new GradleException("MCEF/JCEF import escaped its adapter boundary: ${source}")
                }
            }
        }
    }
}

def consumerArtifactId = 'mcwebui-neoforge-1.21.1'
def consumerRepoDirectory = layout.buildDirectory.dir('consumer-repo')

/**
 * Stages the final NeoForge mod JAR into an isolated Maven repository for the
 * independent consumer fixture.  This intentionally does not use
 * publishToMavenLocal and never writes to ~/.m2.
 */
tasks.register('stageConsumerMaven') {
    group = 'verification'
    description = 'Stage the built NeoForge MCWebUI artifact in an isolated local Maven repository.'
    dependsOn(':targets:neoforge-1.21.1:jar')
    outputs.dir(consumerRepoDirectory)
    // The staging directory is disposable verification output.  Always refresh
    // it so a changed target JAR cannot be hidden behind stale POM metadata.
    outputs.upToDateWhen { false }
    doLast {
        File repository = consumerRepoDirectory.get().asFile
        project.delete(repository)

        File artifact = project(':targets:neoforge-1.21.1').tasks.named('jar').get().archiveFile.get().asFile
        if (!artifact.isFile()) {
            throw new GradleException("NeoForge MCWebUI artifact was not built: ${artifact}")
        }

        String groupId = project.group.toString()
        String versionId = project.version.toString()
        File versionDirectory = new File(repository,
                "${groupId.replace('.', '/')}/${consumerArtifactId}/${versionId}")
        versionDirectory.mkdirs()
        project.copy {
            from(artifact)
            into(versionDirectory)
            rename { "${consumerArtifactId}-${versionId}.jar" }
        }

        String pom = """<?xml version=\"1.0\" encoding=\"UTF-8\"?>
<project xmlns=\"http://maven.apache.org/POM/4.0.0\" xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"
         xsi:schemaLocation=\"http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd\">
  <modelVersion>4.0.0</modelVersion>
  <groupId>${groupId}</groupId>
  <artifactId>${consumerArtifactId}</artifactId>
  <version>${versionId}</version>
  <packaging>jar</packaging>
  <name>MCWebUI NeoForge 1.21.1 Developer Preview</name>
  <description>Binary consumer contract for the MCWebUI Developer Preview API.</description>
  <properties>
    <mcwebui.api.version>1</mcwebui.api.version>
  </properties>
</project>
"""
        new File(versionDirectory, "${consumerArtifactId}-${versionId}.pom").setText(pom, 'UTF-8')

        File metadataDirectory = new File(repository, "${groupId.replace('.', '/')}/${consumerArtifactId}")
        metadataDirectory.mkdirs()
        String metadata = """<?xml version=\"1.0\" encoding=\"UTF-8\"?>
<metadata>
  <groupId>${groupId}</groupId>
  <artifactId>${consumerArtifactId}</artifactId>
  <versioning>
    <latest>${versionId}</latest>
    <release>${versionId}</release>
    <versions><version>${versionId}</version></versions>
  </versioning>
</metadata>
"""
        new File(metadataDirectory, 'maven-metadata.xml').setText(metadata, 'UTF-8')

        // Binary/API and packaging boundary checks run before the independent
        // Gradle process is launched.
        java.util.zip.ZipFile zip = new java.util.zip.ZipFile(artifact)
        try {
            Set<String> entries = zip.entries().collect { it.name } as Set<String>
            ['dev/qingmo/mcwebui/api/MCWebUIApi.class',
             'dev/qingmo/mcwebui/api/WebAppDefinition.class',
             'dev/qingmo/mcwebui/api/neoforge/MCWebUIClient.class',
             'dev/qingmo/mcwebui/api/neoforge/MCWebUIBackendStatus.class',
             'dev/qingmo/mcwebui/resource/WebResourceProvider.class',
             'dev/qingmo/mcwebui/bridge/WebBridge.class'].each { required ->
                if (!entries.contains(required)) {
                    throw new GradleException("Staged MCWebUI artifact is missing public API entry: ${required}")
                }
            }
            def forbidden = entries.findAll { String name ->
                name.startsWith('org/cef/') || name.startsWith('com/cinemamod/mcef/')
                        || name.toLowerCase(Locale.ROOT).endsWith('.dll')
                        || name.toLowerCase(Locale.ROOT).endsWith('.exe')
                        || name.toLowerCase(Locale.ROOT).endsWith('.pak')
                        || name.toLowerCase(Locale.ROOT).endsWith('.zip')
            }
            if (!forbidden.isEmpty()) {
                throw new GradleException("MCWebUI mod artifact embeds forbidden runtime/native files: ${forbidden}")
            }
            def modMetadataEntry = zip.getEntry('META-INF/neoforge.mods.toml')
            if (modMetadataEntry == null) {
                throw new GradleException('Staged MCWebUI artifact is missing NeoForge mod metadata')
            }
            String modMetadata = zip.getInputStream(modMetadataEntry).getText('UTF-8')
            if (!(modMetadata =~ /(?s)\[\[dependencies\.mcwebui\]\]\s*modId="mcef"\s*type="optional"/)) {
                throw new GradleException('Staged MCWebUI metadata must keep MCEF as an optional dependency')
            }
        } finally {
            zip.close()
        }
        logger.lifecycle("Staged ${groupId}:${consumerArtifactId}:${versionId} at ${versionDirectory}")
    }
}

tasks.register('verifyConsumerSample') {
    group = 'verification'
    description = 'Build the standalone NeoForge consumer against only the staged MCWebUI binary artifact.'
    dependsOn('stageConsumerMaven', 'architectureCheck')
    doLast {
        File sample = file('samples/neoforge-1.21.1-consumer')
        if (!sample.isDirectory() || !new File(sample, 'build.gradle').isFile()) {
            throw new GradleException("Missing standalone consumer fixture: ${sample}")
        }
        File wrapper = file('gradlew.bat')
        if (!wrapper.isFile()) wrapper = file('gradlew')
        if (!wrapper.isFile()) throw new GradleException('Gradle wrapper is required for the standalone consumer proof')
        String stagedRepo = consumerRepoDirectory.get().asFile.absolutePath
        if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
            exec {
                workingDir(sample)
                // cmd.exe needs the wrapper and staged repository quoted as one
                // command because this workspace path contains a space.
                String nestedCommand = "\"${wrapper.absolutePath}\" --no-daemon " +
                        "-PmcwebuiConsumerRepo=\"${stagedRepo}\" " +
                        "-PmcwebuiVersion=\"${project.version}\" clean build"
                commandLine 'cmd', '/d', '/c', nestedCommand
            }
        } else {
            exec {
                workingDir(sample)
                commandLine wrapper.absolutePath, '--no-daemon',
                        '-PmcwebuiConsumerRepo=' + stagedRepo,
                        '-PmcwebuiVersion=' + project.version, 'clean', 'build'
            }
        }
        File consumerJar = fileTree(new File(sample, 'build/libs')).matching { include '*.jar' }.files.find { !it.name.endsWith('-sources.jar') }
        if (consumerJar == null || !consumerJar.isFile()) {
            throw new GradleException('Standalone consumer build did not produce a JAR')
        }
        java.util.zip.ZipFile zip = new java.util.zip.ZipFile(consumerJar)
        try {
            Set<String> entries = zip.entries().collect { it.name } as Set<String>
            if (!entries.any { it.endsWith('ConsumerSampleMod.class') }) {
                throw new GradleException("Standalone consumer JAR is missing its mod class: ${consumerJar}")
            }
            if (entries.any { String name -> name.startsWith('dev/qingmo/mcwebui/') }) {
                throw new GradleException("Standalone consumer JAR shaded MCWebUI classes instead of using the mod dependency: ${consumerJar}")
            }
        } finally {
            zip.close()
        }
        logger.lifecycle("Standalone consumer binary proof passed: ${consumerJar}")
    }
}

def candidateDirectory = layout.buildDirectory.dir('release-candidate')
def candidateTask = tasks.register('prepareDeveloperPreviewCandidate') {
    group = 'verification'
    description = 'Build and audit a non-SNAPSHOT source Developer Preview candidate without publishing it.'
    dependsOn('frontendTypecheck', 'frontendBuild', 'testAllTargets', 'buildAllTargets',
            'architectureCheck', 'verifyConsumerSample')
    outputs.dir(candidateDirectory)
    outputs.upToDateWhen { false }
    doLast {
        ByteArrayOutputStream statusOutput = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'status', '--porcelain', '--untracked-files=no'
            standardOutput = statusOutput
        }
        String trackedStatus = statusOutput.toString('UTF-8').trim()
        if (!trackedStatus.isEmpty()) {
            throw new GradleException('Developer Preview candidate requires a clean tracked worktree')
        }

        ByteArrayOutputStream shaOutput = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-parse', 'HEAD'
            standardOutput = shaOutput
        }
        String sourceSha = shaOutput.toString('UTF-8').trim()
        File sourceJar = project(':targets:neoforge-1.21.1').tasks.named('jar').get().archiveFile.get().asFile
        if (!sourceJar.isFile()) throw new GradleException("Missing NeoForge candidate JAR: ${sourceJar}")

        File output = candidateDirectory.get().asFile
        project.delete(output)
        output.mkdirs()
        File candidateJar = new File(output, sourceJar.name)
        project.copy { from(sourceJar); into(output) }

        java.security.MessageDigest digest = java.security.MessageDigest.getInstance('SHA-256')
        candidateJar.withInputStream { input ->
            byte[] buffer = new byte[1024 * 1024]
            for (int read = input.read(buffer); read >= 0; read = input.read(buffer)) {
                if (read > 0) digest.update(buffer, 0, read)
            }
        }
        String jarSha256 = digest.digest().collect { String.format('%02x', it & 0xff) }.join()

        java.util.zip.ZipFile zip = new java.util.zip.ZipFile(candidateJar)
        int nativeLeakage
        boolean releaseDescriptorPresent
        try {
            def entries = zip.entries().collect { it.name }
            nativeLeakage = entries.count { String name ->
                String lower = name.toLowerCase(Locale.ROOT)
                lower.endsWith('.dll') || lower.endsWith('.exe') || lower.endsWith('.pak')
                        || lower.endsWith('.zip') || lower.contains('libcef')
                        || lower.contains('chrome_elf') || lower.contains('cef_binary_')
            }
            releaseDescriptorPresent = entries.contains('META-INF/mcwebui/direct-cef-runtime-release.json')
        } finally {
            zip.close()
        }
        if (nativeLeakage != 0) throw new GradleException("Candidate JAR native/runtime leakage=${nativeLeakage}")

        boolean sourceConfigured = releaseDescriptorPresent
        Map<String, Object> report = new LinkedHashMap<>()
        report.put('mcwebuiVersion', project.version.toString())
        report.put('sourceGitSha', sourceSha)
        report.put('trackedWorktreeClean', true)
        report.put('apiVersion', 1)
        report.put('target', 'neoforge-1.21.1')
        report.put('jar', [filename: candidateJar.name, size: candidateJar.length(), sha256: jarSha256])
        report.put('backendDefault', 'MCEF')
        report.put('direct', [os: 'windows', arch: 'x86_64',
                requiredGraphicsInterop: 'WGL_NV_DX_interop + WGL_NV_DX_interop2',
                currentAutomatedVendorEvidence: 'NVIDIA-only'])
        report.put('runtimeDistribution', [phaseA: 'implemented', phaseB: 'implemented', phaseCCore: 'implemented'])
        report.put('productionRuntimeSource', sourceConfigured ? 'CONFIGURED' : 'UNCONFIGURED')
        report.put('consumerBinaryProof', 'PASS')
        report.put('nativeRuntimeLeakage', nativeLeakage)
        report.put('publication', sourceConfigured
                ? 'BLOCKED_PENDING_REAL_RELEASE_ACCEPTANCE'
                : 'BLOCKED_WAITING_FOR_OFFICIAL_RUNTIME')
        new File(output, 'candidate-report.json').setText(
                groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(report)) + System.lineSeparator(), 'UTF-8')
        new File(output, 'checksums.txt').setText(
                "${jarSha256}  ${candidateJar.name}${System.lineSeparator()}", 'UTF-8')
        logger.lifecycle("Developer Preview source candidate prepared: ${candidateJar}")
    }
}

gradle.taskGraph.whenReady { graph ->
    if (graph.hasTask(candidateTask.get()) && project.version.toString().toUpperCase(Locale.ROOT).contains('SNAPSHOT')) {
        throw new GradleException('mcwebuiVersion must be a non-SNAPSHOT release candidate version')
    }
}

tasks.named('check') { dependsOn('architectureCheck') }

tasks.named('build') {
    dependsOn('buildAllTargets')
}
