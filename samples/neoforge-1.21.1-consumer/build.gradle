plugins {
    id 'net.neoforged.moddev' version '2.0.141'
}

group = 'dev.qingmo.mcwebui.samples'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven { url = uri('https://maven.neoforged.net/releases') }
    maven { url = uri('https://maven.aliyun.com/repository/public/') }
    def staged = providers.gradleProperty('mcwebuiConsumerRepo')
            .map { file(it) }
            .orElse(file('../../build/consumer-repo'))
    maven { url = staged }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

def mcwebuiVersion = '0.1.0-SNAPSHOT'

dependencies {
    // This is deliberately a binary Maven dependency.  The root verification
    // task stages the final MCWebUI mod JAR into an isolated repository first.
    implementation "dev.qingmo.mcwebui:mcwebui-neoforge-1.21.1:${mcwebuiVersion}"
    implementation 'net.neoforged:neoforge:21.1.216'
}

neoForge {
    version = '21.1.216'
    runs {
        client {
            client()
            gameDirectory = layout.projectDirectory.dir('run')
        }
    }
    mods {
        mcwebui_consumer_sample {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// The sample is a normal mod artifact and must not shade MCWebUI or its
// browser/runtime implementation into the consumer JAR.
tasks.named('jar') {
    duplicatesStrategy = DuplicatesStrategy.FAIL
}
